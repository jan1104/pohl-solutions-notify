name: Project checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax and metadata
        run: python scripts/validate.py
      - name: Test alarm model and configuration boundaries
        run: python -m unittest discover -s tests -v
      - name: Check frontend syntax
        run: node --check custom_components/alarm_system/frontend/panel.js
